<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Cannon Smash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #0a0e16;
    color: #e8ecf7;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  #hud {
    width: 100%;
    max-width: 960px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    flex: 0 0 auto;
  }
  .stat { text-align: center; }
  .stat .label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #8fa0c7; }
  .stat .value { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }

  #bomb-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 90px; }
  #bomb-top { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #8fa0c7; }
  #bomb-bar { height: 12px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 7px; overflow: hidden; }
  #bomb-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb347, #ff3b2e); transition: width .2s ease; }
  #bomb-ready { color: #ff7a2e; font-weight: 800; }
  #bomb-ready.hidden { visibility: hidden; }

  #stage { position: relative; flex: 1 1 auto; width: 100%; max-width: 960px; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: #2a3a52; font-size: 13px; font-weight: 600; letter-spacing: .5px; pointer-events: none;
    background: rgba(255,255,255,.6); padding: 6px 14px; border-radius: 999px;
    transition: opacity .4s ease;
  }

  .overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; z-index: 10;
    background: rgba(8, 11, 22, .72); backdrop-filter: blur(3px);
  }
  .overlay.show { display: flex; }
  .panel {
    background: linear-gradient(160deg, #1d2742, #121a30);
    border: 1px solid rgba(255,255,255,.15); border-radius: 18px;
    padding: 28px 34px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6);
    animation: pop .3s ease;
  }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } }
  .panel h2 { font-size: 26px; margin-bottom: 6px; }
  .panel .sub { color: #8fa0c7; margin-bottom: 18px; }
  .panel button {
    font: inherit; font-size: 16px; font-weight: 800; letter-spacing: 1px;
    color: #0b1020; background: linear-gradient(135deg, #ffb347, #ff5e2e);
    border: none; border-radius: 11px; padding: 12px 30px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(255,94,46,.45);
  }
  .panel button:active { transform: scale(.95); }
</style>
</head>
<body>
  <div id="hud">
    <div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
    <div class="stat"><div class="label">Shots</div><div class="value" id="shots">0</div></div>
    <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div id="bomb-wrap">
      <div id="bomb-top"><span>Bomb</span><span id="bomb-ready" class="hidden">★ MEGA ×2</span></div>
      <div id="bomb-bar"><div id="bomb-fill"></div></div>
    </div>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint">Tap the bricks to fire the cannon!</div>
    <div class="overlay" id="win">
      <div class="panel">
        <h2 id="win-title">Level Cleared!</h2>
        <div class="sub" id="win-sub">Nice shooting.</div>
        <button id="next-btn">Next Level</button>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // Head-on view: cannon at bottom-centre fires UP at a brick stack on a
  // table in the middle distance. Pseudo-3D: cuboid bricks, a legged table,
  // a foreshortened cannon, depth shading and shadows.
  const WORLD_W = 640, WORLD_H = 960;
  const HORIZON = 330;
  const TABLE_CX = 320, TABLE_TOP = 548, TABLE_HW = 150;
  const LEG_BOTTOM = 726;
  const PIVOT = { x: 320, y: 858 };
  const GRAV = 0.5;
  const DEPTH_X = 13, DEPTH_Y = -11;   // cuboid depth direction (up-right)

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const levelEl = document.getElementById("level");
  const shotsEl = document.getElementById("shots");
  const scoreEl = document.getElementById("score");
  const bombFill = document.getElementById("bomb-fill");
  const bombReady = document.getElementById("bomb-ready");
  const hintEl = document.getElementById("hint");
  const winOverlay = document.getElementById("win");
  const winTitle = document.getElementById("win-title");
  const winSub = document.getElementById("win-sub");
  const nextBtn = document.getElementById("next-btn");

  let scale = 1, offX = 0, offY = 0, dpr = 1;
  function resize() {
    const rect = cv.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(rect.width * dpr);
    cv.height = Math.round(rect.height * dpr);
    scale = Math.min(rect.width / WORLD_W, rect.height / WORLD_H);
    offX = (rect.width - WORLD_W * scale) / 2;
    offY = (rect.height - WORLD_H * scale) / 2;
  }
  window.addEventListener("resize", resize);

  // ---- game state ----
  let level = 1, score = 0, shots = 0;
  let bricks = [], balls = [], particles = [];
  let barrier = null;
  let bombPct = 0, megaCharges = 0;
  let aimAngle = -Math.PI / 2;
  let levelDone = false;
  const trees = [];

  function settledBricks() { return bricks.filter((b) => b.state === "settled"); }

  for (let i = 0; i < 8; i++) {
    trees.push({ x: 30 + i * 82 + Math.random() * 24, y: HORIZON - 6 - Math.random() * 14, s: 18 + Math.random() * 22 });
  }

  // ---- level generation ----
  function buildLevel(n) {
    bricks = []; balls = []; particles = [];
    bombPct = 0; megaCharges = 0; levelDone = false;
    updateBombUI();

    const bw = 54, bh = 30, gap = 2;
    const cols = Math.min(3 + Math.floor(n / 3), 4);
    const rows = Math.min(3 + Math.floor((n - 1) / 1), 6);
    const metalChance = Math.min(0.08 + n * 0.08, 0.55);

    for (let r = 0; r < rows; r++) {
      const rowCols = (r >= 2 && r % 2 === 1) ? cols - 1 : cols; // slight pyramid
      const stackW = rowCols * bw + (rowCols - 1) * gap;
      const startX = TABLE_CX - stackW / 2;
      for (let c = 0; c < rowCols; c++) {
        const metal = n >= 2 && Math.random() < metalChance;
        bricks.push({
          cx: startX + c * (bw + gap) + bw / 2,
          cy: TABLE_TOP - bh / 2 - r * (bh + gap),
          hw: bw / 2, hh: bh / 2,
          vx: 0, vy: 0, av: 0, angle: 0,
          metal, hp: metal ? 3 : 1, mass: metal ? 3 : 1,
          state: "settled",
        });
      }
    }

    barrier = n >= 3 ? {
      y: 660, h: 22, w: 200, x: 60,
      min: 20, max: 620, dir: 1, speed: 1.7 + n * 0.18,
    } : null;

    levelEl.textContent = n;
    shots = 0; shotsEl.textContent = "0";
  }

  // ---- firing ----
  function fire(tx, ty) {
    if (levelDone) return;
    const dx = tx - PIVOT.x, dy = ty - PIVOT.y;
    const len = Math.hypot(dx, dy) || 1;
    aimAngle = Math.atan2(dy, dx);
    const mega = megaCharges > 0;
    const speed = mega ? 19 : 21;
    const tipX = PIVOT.x + Math.cos(aimAngle) * 60;
    const tipY = PIVOT.y + Math.sin(aimAngle) * 60;
    balls.push({ x: tipX, y: tipY, vx: (dx / len) * speed, vy: (dy / len) * speed, r: mega ? 23 : 11, mega, alive: true });
    for (let i = 0; i < 10; i++) spawnSmoke(tipX, tipY);

    shots++; shotsEl.textContent = shots;
    if (mega) megaCharges--;
    else { bombPct += 25; if (bombPct >= 100) { bombPct = 0; megaCharges = 2; } }
    updateBombUI();
    hideHint();
  }

  function updateBombUI() {
    bombFill.style.width = bombPct + "%";
    if (megaCharges > 0) { bombReady.classList.remove("hidden"); bombReady.textContent = "★ MEGA ×" + megaCharges; }
    else bombReady.classList.add("hidden");
  }

  let hintHidden = false;
  function hideHint() { if (!hintHidden) { hintHidden = true; hintEl.style.opacity = "0"; } }

  // ---- particles ----
  function spawnSmoke(x, y) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5 - 3, life: 1, color: "#f3d9a0", smoke: true });
  }
  function explode(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 7;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, color });
    }
  }

  // ---- physics ----
  function dislodge(b, ix, iy, power) {
    if (b.state !== "settled") {
      b.vx += ix * power / b.mass; b.vy += iy * power / b.mass; b.av += (Math.random() - 0.5) * 0.25; return;
    }
    b.state = "debris";
    b.vx += ix * power / b.mass + (Math.random() - 0.5) * 4;
    b.vy += iy * power / b.mass;
    b.av += ix * 0.05 + (Math.random() - 0.5) * 0.25;
    score += 10; scoreEl.textContent = score;
    explode(b.cx, b.cy, b.metal ? "#cfd6e6" : "#e0843a", 10);
  }

  function ballHitsBrick(ball, b) {
    const cx = Math.max(b.cx - b.hw, Math.min(ball.x, b.cx + b.hw));
    const cy = Math.max(b.cy - b.hh, Math.min(ball.y, b.cy + b.hh));
    const dx = ball.x - cx, dy = ball.y - cy;
    return dx * dx + dy * dy <= ball.r * ball.r;
  }

  function stepBall(ball) {
    const speed = Math.hypot(ball.vx, ball.vy);
    const steps = Math.max(1, Math.ceil(speed / 6));
    for (let s = 0; s < steps && ball.alive; s++) {
      ball.x += ball.vx / steps; ball.y += ball.vy / steps;

      if (barrier && ball.y - ball.r < barrier.y + barrier.h && ball.y + ball.r > barrier.y &&
          ball.x + ball.r > barrier.x && ball.x - ball.r < barrier.x + barrier.w) {
        if (!ball.mega) { explode(ball.x, ball.y, "#9fb0c8", 12); ball.alive = false; return; }
      }

      const dl = Math.hypot(ball.vx, ball.vy) || 1;
      const dir = { x: ball.vx / dl, y: ball.vy / dl };

      for (const b of bricks) {
        if (b.state === "debris" || !ballHitsBrick(ball, b)) continue;
        if (ball.mega) {
          explode(ball.x, ball.y, "#ff7a2e", 42);
          const R = 155;
          for (const o of bricks) {
            const ox = o.cx - ball.x, oy = o.cy - ball.y, d = Math.hypot(ox, oy);
            if (d < R) dislodge(o, ox / (d || 1), oy / (d || 1) - 0.3, (1 - d / R) * 34);
          }
          ball.alive = false; return;
        }
        b.hp--;
        explode(ball.x, ball.y, b.metal ? "#dfe6f2" : "#e0843a", 8);
        if (b.hp <= 0) dislodge(b, dir.x, dir.y, 16);
        else b.av += (Math.random() - 0.5) * 0.05;
        if (b.metal && b.hp > 0) { ball.vx *= 0.2; ball.vy *= 0.2; }
        else { ball.vx *= 0.55; ball.vy *= 0.55; }
        if (Math.hypot(ball.vx, ball.vy) < 4) { ball.alive = false; return; }
      }
    }
    if (ball.x < -40 || ball.x > WORLD_W + 40 || ball.y < -120 || ball.y > WORLD_H + 60) ball.alive = false;
  }

  function isSupported(b) {
    if (b.cy + b.hh >= TABLE_TOP - 4 && b.cx > TABLE_CX - TABLE_HW - 6 && b.cx < TABLE_CX + TABLE_HW + 6) return true;
    for (const o of bricks) {
      if (o === b || o.state !== "settled") continue;
      const xover = Math.abs(o.cx - b.cx) < (o.hw + b.hw - 6);
      const onTop = Math.abs((o.cy - o.hh) - (b.cy + b.hh)) < 6;
      if (xover && onTop && o.cy > b.cy) return true;
    }
    return false;
  }

  function update() {
    if (barrier) {
      barrier.x += barrier.dir * barrier.speed;
      if (barrier.x < barrier.min) { barrier.x = barrier.min; barrier.dir = 1; }
      if (barrier.x + barrier.w > barrier.max) { barrier.x = barrier.max - barrier.w; barrier.dir = -1; }
    }

    for (const ball of balls) stepBall(ball);
    balls = balls.filter((b) => b.alive);

    for (const b of bricks) {
      if (b.state === "settled" && !isSupported(b)) { b.state = "debris"; b.vy += 0.4; b.av += (Math.random() - 0.5) * 0.12; }
    }

    for (const b of bricks) {
      if (b.state !== "debris") continue;
      b.vy += GRAV; b.cx += b.vx; b.cy += b.vy; b.angle += b.av; b.vx *= 0.992;
    }
    bricks = bricks.filter((b) => b.cx > -150 && b.cx < WORLD_W + 150 && b.cy < WORLD_H + 120);

    for (const p of particles) { p.vy += p.smoke ? 0.02 : 0.18; p.x += p.vx; p.y += p.vy; if (p.smoke) p.vx *= 0.94; p.life -= p.smoke ? 0.03 : 0.025; }
    particles = particles.filter((p) => p.life > 0);

    if (!levelDone && settledBricks().length === 0 && balls.length === 0) {
      levelDone = true;
      score += Math.max(0, 120 - shots * 10); scoreEl.textContent = score;
      setTimeout(showWin, 500);
    }
  }

  function showWin() {
    winTitle.textContent = "Level " + level + " Cleared!";
    winSub.textContent = "Cleared in " + shots + (shots === 1 ? " shot." : " shots.");
    winOverlay.classList.add("show");
  }
  nextBtn.addEventListener("click", () => { winOverlay.classList.remove("show"); level++; buildLevel(level); });

  // ---- rendering ----
  function path(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  function drawCuboid(b) {
    ctx.save();
    ctx.translate(b.cx, b.cy);
    ctx.rotate(b.angle);
    const hw = b.hw, hh = b.hh, dx = DEPTH_X, dy = DEPTH_Y;
    const top   = b.metal ? "#eef2f8" : "#e6a35c";
    const sideC = b.metal ? "#6b7488" : "#8a4017";
    // top face
    ctx.fillStyle = top;
    path([[-hw, -hh], [hw, -hh], [hw + dx, -hh + dy], [-hw + dx, -hh + dy]]); ctx.fill();
    // right face
    ctx.fillStyle = sideC;
    path([[hw, -hh], [hw, hh], [hw + dx, hh + dy], [hw + dx, -hh + dy]]); ctx.fill();
    // front face
    const g = ctx.createLinearGradient(0, -hh, 0, hh);
    if (b.metal) { g.addColorStop(0, "#dfe6f2"); g.addColorStop(.5, "#aab4ca"); g.addColorStop(1, "#7a8399"); }
    else { g.addColorStop(0, "#d98a4a"); g.addColorStop(1, "#a8541f"); }
    ctx.fillStyle = g;
    ctx.strokeStyle = b.metal ? "#3a4258" : "#6e3413";
    ctx.lineWidth = 1.5;
    path([[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]]); ctx.fill(); ctx.stroke();
    if (!b.metal) {
      ctx.strokeStyle = "rgba(110,52,19,.35)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-hw + 4, -hh + 6); ctx.lineTo(hw - 4, -hh + 6);
      ctx.moveTo(-hw + 4, hh - 6); ctx.lineTo(hw - 4, hh - 6); ctx.stroke();
    } else {
      ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.beginPath(); ctx.arc(-hw + 7, -hh + 7, 2, 0, 7); ctx.arc(hw - 7, -hh + 7, 2, 0, 7);
      ctx.arc(-hw + 7, hh - 7, 2, 0, 7); ctx.arc(hw - 7, hh - 7, 2, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function drawTable() {
    const cx = TABLE_CX, top = TABLE_TOP, tw = TABLE_HW;
    const dx = 26, dy = -20;            // tabletop perspective depth
    // shadow on snow
    ctx.fillStyle = "rgba(40,60,90,.18)";
    ctx.beginPath(); ctx.ellipse(cx + 6, LEG_BOTTOM + 6, tw + 24, 22, 0, 0, 7); ctx.fill();
    // back legs
    ctx.fillStyle = "#6e4a28";
    for (const lx of [cx - tw + 30, cx + tw - 30]) {
      path([[lx + dx, top + dy + 8], [lx + dx + 12, top + dy + 8], [lx + 6, LEG_BOTTOM], [lx - 4, LEG_BOTTOM]]); ctx.fill();
    }
    // tabletop slab (cuboid)
    ctx.fillStyle = "#caa06a"; // top surface
    path([[cx - tw, top], [cx + tw, top], [cx + tw + dx, top + dy], [cx - tw + dx, top + dy]]); ctx.fill();
    ctx.fillStyle = "#9a6f3e"; // front apron
    path([[cx - tw, top], [cx + tw, top], [cx + tw, top + 16], [cx - tw, top + 16]]); ctx.fill();
    ctx.fillStyle = "#7d5a32"; // right apron
    path([[cx + tw, top], [cx + tw + dx, top + dy], [cx + tw + dx, top + dy + 16], [cx + tw, top + 16]]); ctx.fill();
    // front legs
    ctx.fillStyle = "#8a5e34";
    for (const lx of [cx - tw + 22, cx + tw - 22]) {
      path([[lx - 8, top + 16], [lx + 8, top + 16], [lx + 5, LEG_BOTTOM], [lx - 5, LEG_BOTTOM]]); ctx.fill();
    }
  }

  function drawCannon() {
    // shadow
    ctx.fillStyle = "rgba(40,60,90,.22)";
    ctx.beginPath(); ctx.ellipse(PIVOT.x, PIVOT.y + 30, 76, 20, 0, 0, 7); ctx.fill();
    ctx.save();
    ctx.translate(PIVOT.x, PIVOT.y);
    ctx.rotate(aimAngle + Math.PI / 2);   // barrel drawn along local -Y, aimed at target
    // barrel body (tapered, foreshortened)
    const g = ctx.createLinearGradient(-40, 0, 40, 0);
    g.addColorStop(0, "#3a4254"); g.addColorStop(.5, "#79849c"); g.addColorStop(1, "#2c3340");
    ctx.fillStyle = g;
    path([[-42, 20], [42, 20], [34, -78], [-34, -78]]); ctx.fill();
    // rope rings
    ctx.fillStyle = "#b9854e";
    for (const ry of [-2, -46]) { ctx.fillStyle = ry === -2 ? "#b9854e" : "#a9743e"; ctx.fillRect(-44, ry, 88, 12); }
    ctx.strokeStyle = "rgba(60,40,20,.4)"; ctx.lineWidth = 1;
    for (const ry of [-2, -46]) for (let xx = -42; xx < 44; xx += 9) { ctx.beginPath(); ctx.moveTo(xx, ry); ctx.lineTo(xx + 6, ry + 12); ctx.stroke(); }
    // muzzle bore
    ctx.fillStyle = "#5a667e";
    ctx.beginPath(); ctx.ellipse(0, -78, 34, 14, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#171c26";
    ctx.beginPath(); ctx.ellipse(0, -78, 23, 9, 0, 0, 7); ctx.fill();
    ctx.restore();
    // mount cap
    ctx.fillStyle = "#2c3340";
    ctx.beginPath(); ctx.ellipse(PIVOT.x, PIVOT.y + 14, 30, 16, 0, 0, 7); ctx.fill();
  }

  function drawBackground() {
    // full-bleed: fill the entire visible canvas so there are no letterbox bars
    const vL = -offX / scale, vT = -offY / scale;
    const vW = cv.width / (dpr * scale), vH = cv.height / (dpr * scale);
    const sky = ctx.createLinearGradient(0, vT, 0, HORIZON);
    sky.addColorStop(0, "#a9d2f2"); sky.addColorStop(1, "#dcefff");
    ctx.fillStyle = sky; ctx.fillRect(vL, vT, vW, HORIZON - vT);
    // distant hills
    ctx.fillStyle = "#cfe6f6";
    ctx.beginPath(); ctx.ellipse(160, HORIZON, 260, 64, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(500, HORIZON, 300, 80, 0, Math.PI, 0); ctx.fill();
    // pine trees
    for (const t of trees) {
      ctx.fillStyle = "#9fc0d8";
      ctx.beginPath(); ctx.moveTo(t.x, t.y - t.s); ctx.lineTo(t.x - t.s * .45, t.y); ctx.lineTo(t.x + t.s * .45, t.y); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(t.x, t.y - t.s * 1.4); ctx.lineTo(t.x - t.s * .35, t.y - t.s * .5); ctx.lineTo(t.x + t.s * .35, t.y - t.s * .5); ctx.closePath(); ctx.fill();
    }
    // snow ground
    const snow = ctx.createLinearGradient(0, HORIZON, 0, vT + vH);
    snow.addColorStop(0, "#ffffff"); snow.addColorStop(1, "#d6e6f4");
    ctx.fillStyle = snow; ctx.fillRect(vL, HORIZON, vW, (vT + vH) - HORIZON);
    ctx.fillStyle = "rgba(180,205,230,.4)";
    ctx.beginPath(); ctx.ellipse(320, HORIZON + 14, 380, 26, 0, 0, Math.PI * 2); ctx.fill();
  }

  function render() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
    ctx.clearRect(-offX / scale - 2, -offY / scale - 2, cv.width + 200, cv.height + 200);
    drawBackground();
    drawTable();

    // bricks: far (small y) first, near (large y) last
    const sorted = bricks.slice().sort((a, b) => a.cy - b.cy);
    for (const b of sorted) drawCuboid(b);

    if (barrier) {
      const g = ctx.createLinearGradient(0, barrier.y, 0, barrier.y + barrier.h);
      g.addColorStop(0, "#cdd6e6"); g.addColorStop(.5, "#7e8aa2"); g.addColorStop(1, "#4d5568");
      ctx.fillStyle = g;
      ctx.fillRect(barrier.x, barrier.y, barrier.w, barrier.h);
      ctx.fillStyle = "rgba(255,255,255,.4)";
      for (let xx = barrier.x + 8; xx < barrier.x + barrier.w - 6; xx += 16) ctx.fillRect(xx, barrier.y + 4, 3, barrier.h - 8);
    }

    drawCannon();

    for (const ball of balls) {
      ctx.fillStyle = ball.mega ? "#ff5e2e" : "#1c2536";
      ctx.strokeStyle = ball.mega ? "#ffd24d" : "#e8ecf7";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.beginPath(); ctx.arc(ball.x - ball.r * .3, ball.y - ball.r * .3, ball.r * .3, 0, 7); ctx.fill();
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life) * (p.smoke ? .7 : 1);
      ctx.fillStyle = p.color;
      if (p.smoke) { ctx.beginPath(); ctx.arc(p.x, p.y, 5 * (1.4 - p.life), 0, 7); ctx.fill(); }
      else ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function loop() { update(); render(); requestAnimationFrame(loop); }

  // ---- input ----
  function worldFromEvent(e) {
    const rect = cv.getBoundingClientRect();
    return { x: (e.clientX - rect.left - offX) / scale, y: (e.clientY - rect.top - offY) / scale };
  }
  cv.addEventListener("pointermove", (e) => { const p = worldFromEvent(e); aimAngle = Math.atan2(p.y - PIVOT.y, p.x - PIVOT.x); });
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); const p = worldFromEvent(e); fire(p.x, p.y); });

  window.__cannon = {
    state: () => ({ level, score, shots, settled: settledBricks().length, total: bricks.length, mega: megaCharges, bombPct }),
    settledPositions: () => settledBricks().map((b) => ({ x: b.cx, y: b.cy })),
    busy: () => balls.length > 0,
    fire: (x, y) => fire(x, y),
    nextReady: () => winOverlay.classList.contains("show"),
    next: () => nextBtn.click(),
  };

  resize();
  buildLevel(1);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
