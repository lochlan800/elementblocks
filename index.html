<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at 50% -20%, #2b3a5e 0%, #10162a 55%, #0a0e1c 100%);
    background-attachment: fixed;
    color: #e8ecf7;
    min-height: 100%;
    padding: 28px 16px 48px;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 920px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 26px; }

  h1 {
    font-size: clamp(30px, 7vw, 46px);
    letter-spacing: 4px;
    font-weight: 800;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff9a4d, #4dc3ff, #7dff8a, #d9b8ff, #ffe14d);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(80, 140, 255, .35));
  }

  .tagline { color: #8fa0c7; margin-top: 6px; font-size: 14px; letter-spacing: 1px; }

  /* ---- search ---- */
  .search-box {
    position: relative;
    max-width: 480px;
    margin: 22px auto 8px;
  }

  .search-box svg {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    fill: #8fa0c7;
    pointer-events: none;
  }

  #search {
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: #e8ecf7;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .15);
    border-radius: 14px;
    padding: 14px 44px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  #search::placeholder { color: #6f7ea3; }
  #search:focus {
    border-color: rgba(77, 195, 255, .7);
    box-shadow: 0 0 0 3px rgba(77, 195, 255, .18);
  }

  #clear-search {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    border: none; background: none;
    color: #8fa0c7; font-size: 22px;
    cursor: pointer; line-height: 1;
    padding: 6px 8px; display: none;
  }
  #search:not(:placeholder-shown) ~ #clear-search { display: block; }

  /* ---- category sections ---- */
  .category { margin-top: 30px; }
  .category.hidden { display: none; }

  .cat-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: #8fa0c7;
    margin-bottom: 14px;
  }
  .cat-title::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,.15), transparent);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  /* ---- game card ---- */
  .card {
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s ease, border-color .2s ease, box-shadow .2s ease;
    text-align: left;
    display: flex;
    flex-direction: column;
  }
  .card.hidden { display: none; }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    border-color: rgba(255, 255, 255, .3);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .45);
    outline: none;
  }

  .thumb {
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    position: relative;
  }
  .thumb.blocks { background: linear-gradient(135deg, #ff5e2e, #2e8eff 55%, #7dff8a); }
  .thumb.chess  { background: linear-gradient(135deg, #3a4a6e, #11172b); }
  .thumb.money  { background: linear-gradient(135deg, #2e7d32, #1e6b3a 50%, #b8902e); }
  .thumb.cannon { background: linear-gradient(135deg, #ff7a2e, #6c3a1a 60%, #2a3a55); }
  .thumb.wordle { background: linear-gradient(135deg, #6aaa64, #3a7a4a 55%, #c9b458); }
  .thumb.uno    { background: linear-gradient(135deg, #d63031, #e1a100 40%, #0984e3 75%, #2d9c3f); }
  .thumb.guesswho { background: linear-gradient(135deg, #5b57d6, #8a2fb0 60%, #2a2f6e); }
  .thumb.gems   { background: linear-gradient(135deg, #7a2eff, #2e4a8e 55%, #12aabb); }
  .thumb .glyph { filter: drop-shadow(0 3px 6px rgba(0,0,0,.4)); }

  .card-body { padding: 12px 14px 14px; }
  .card-name { font-size: 17px; font-weight: 700; }
  .card-cat {
    display: inline-block;
    margin-top: 7px;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase;
    color: #bcd0ff;
    background: rgba(77, 195, 255, .15);
    border: 1px solid rgba(77, 195, 255, .3);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .card-desc { color: #8fa0c7; font-size: 13px; margin-top: 9px; line-height: 1.4; }

  #no-results {
    display: none;
    text-align: center;
    color: #8fa0c7;
    margin-top: 40px;
    font-size: 16px;
  }
  #no-results.show { display: block; }

  /* ---- confirm modal ---- */
  #modal {
    position: fixed; inset: 0;
    background: rgba(8, 11, 22, .82);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
  }
  #modal.show { display: flex; }

  .modal-panel {
    width: min(90vw, 360px);
    background: linear-gradient(160deg, #1d2742, #121a30);
    border: 1px solid rgba(255, 255, 255, .15);
    border-radius: 18px;
    padding: 30px 28px 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
    animation: pop .25s ease;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }

  .modal-glyph { font-size: 48px; margin-bottom: 10px; }
  .modal-q { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .modal-sub { color: #8fa0c7; font-size: 14px; margin-bottom: 22px; }

  .modal-btns { display: flex; gap: 12px; }
  .modal-btns button {
    flex: 1; font: inherit; font-size: 16px; font-weight: 700;
    border-radius: 11px; padding: 13px 0; cursor: pointer;
    transition: transform .1s ease;
  }
  .modal-btns button:active { transform: scale(.95); }
  #yes-btn {
    color: #0b1020; border: none;
    background: linear-gradient(135deg, #7dff8a, #4dc3ff);
    box-shadow: 0 4px 16px rgba(77, 195, 255, .4);
  }
  #no-btn {
    color: #e8ecf7;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .18);
  }

  /* ---- game overlay ---- */
  #player {
    position: fixed; inset: 0;
    background: #0a0e1c;
    display: none;
    flex-direction: column;
    z-index: 60;
  }
  #player.show { display: flex; }

  .player-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    background: #121a30;
    border-bottom: 1px solid rgba(255, 255, 255, .1);
    flex: 0 0 auto;
  }
  .player-bar .back {
    font: inherit; font-size: 15px; font-weight: 700;
    color: #e8ecf7;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .18);
    border-radius: 10px;
    padding: 9px 16px; cursor: pointer;
  }
  .player-bar .back:active { transform: scale(.96); }
  .player-bar .title { font-weight: 700; font-size: 16px; }
  .player-bar .spacer { flex: 1; }
  .player-bar .newtab {
    color: #8fa0c7; font-size: 13px; text-decoration: none;
    border: 1px solid rgba(255,255,255,.15); border-radius: 10px;
    padding: 8px 12px;
  }
  .player-bar .newtab:hover { color: #e8ecf7; }

  #game-frame { flex: 1; width: 100%; border: none; background: #0a0e1c; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Game Hub</h1>
    <div class="tagline">Pick a game and play</div>
  </header>

  <div class="search-box">
    <svg viewBox="0 0 24 24"><path d="M21.7 20.3l-5.4-5.4a8 8 0 1 0-1.4 1.4l5.4 5.4a1 1 0 0 0 1.4-1.4zM4 10a6 6 0 1 1 12 0 6 6 0 0 1-12 0z"/></svg>
    <input id="search" type="text" placeholder="Search games, e.g. chess" autocomplete="off">
    <button id="clear-search" aria-label="Clear search">&times;</button>
  </div>

  <div id="catalog"></div>
  <div id="no-results">No games found — try a different search.</div>
</div>

<!-- confirm modal -->
<div id="modal">
  <div class="modal-panel">
    <div class="modal-glyph" id="modal-glyph"></div>
    <div class="modal-q" id="modal-q"></div>
    <div class="modal-sub">Do you want to play?</div>
    <div class="modal-btns">
      <button id="no-btn">No</button>
      <button id="yes-btn">Yes</button>
    </div>
  </div>
</div>

<!-- fullscreen game player -->
<div id="player">
  <div class="player-bar">
    <button class="back" id="back-btn">&larr; Back to Games</button>
    <span class="title" id="player-title"></span>
    <span class="spacer"></span>
    <a class="newtab" id="newtab-link" href="#" target="_blank" rel="noopener">Open in new tab &#8599;</a>
  </div>
  <iframe id="game-frame" title="Game" allow="autoplay"></iframe>
</div>

<script>
(() => {
  "use strict";

  // The list of games. Add more here as they are built.
  const GAMES = [
    {
      id: "elementblocks",
      name: "Element Blocks",
      category: "Puzzle",
      glyph: "🧩",          // 🧩
      thumb: "blocks",
      desc: "Drop elemental shapes, clear lines, chase combos.",
      url: "elementblocks.html",
    },
    {
      id: "gemswap",
      name: "Gem Swap",
      category: "Puzzle",
      glyph: "💎",          // 💎
      thumb: "gems",
      desc: "Swap gems to match three or more, chain combos, beat the target.",
      url: "gems/",
    },
    {
      id: "chess",
      name: "Chess",
      category: "Strategy",
      glyph: "♟️",          // ♟️
      thumb: "chess",
      desc: "The classic battle of kings, queens and pawns.",
      url: "https://lochlan800.github.io/Chess-/",
    },
    {
      id: "moneyclicker",
      name: "Money Clicker",
      category: "Idle",
      glyph: "💰",          // 💰
      thumb: "money",
      desc: "Tap to earn cash and buy upgrades that earn for you.",
      url: "clicker/",
    },
    {
      id: "cannon",
      name: "Cannon Smash",
      category: "Arcade",
      glyph: "💥",          // 💥
      thumb: "cannon",
      desc: "Tap bricks to fire the cannon, topple the stack, unleash mega bombs.",
      url: "cannon/",
    },
    {
      id: "wordle",
      name: "Wordle",
      category: "Word",
      glyph: "🟩",          // 🟩
      thumb: "wordle",
      desc: "Guess the hidden five-letter word in six tries.",
      url: "wordle/",
    },
    {
      id: "uno",
      name: "Uno",
      category: "Cards",
      glyph: "🃏",          // 🃏
      thumb: "uno",
      desc: "Match colours and numbers — be first to empty your hand.",
      url: "uno/",
    },
    {
      id: "guesswho",
      name: "Guess Who",
      category: "Party",
      glyph: "🕵️",          // 🕵️
      thumb: "guesswho",
      desc: "Ask yes/no questions to unmask your rival's character.",
      url: "guesswho/",
    },
  ];

  const CATEGORY_ORDER = ["Puzzle", "Word", "Strategy", "Idle", "Arcade", "Cards", "Party"];

  const catalogEl = document.getElementById("catalog");
  const searchEl = document.getElementById("search");
  const clearBtn = document.getElementById("clear-search");
  const noResultsEl = document.getElementById("no-results");

  const modalEl = document.getElementById("modal");
  const modalGlyph = document.getElementById("modal-glyph");
  const modalQ = document.getElementById("modal-q");
  const yesBtn = document.getElementById("yes-btn");
  const noBtn = document.getElementById("no-btn");

  const playerEl = document.getElementById("player");
  const playerTitle = document.getElementById("player-title");
  const gameFrame = document.getElementById("game-frame");
  const backBtn = document.getElementById("back-btn");
  const newtabLink = document.getElementById("newtab-link");

  let pendingGame = null;
  const cardEls = [];

  // Build category sections and cards.
  const categories = [...new Set(GAMES.map((g) => g.category))]
    .sort((a, b) => CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b));

  for (const cat of categories) {
    const section = document.createElement("section");
    section.className = "category";
    section.dataset.category = cat;

    const title = document.createElement("div");
    title.className = "cat-title";
    title.textContent = cat;
    section.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "grid";

    for (const game of GAMES.filter((g) => g.category === cat)) {
      const card = document.createElement("div");
      card.className = "card";
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.innerHTML =
        `<div class="thumb ${game.thumb}"><span class="glyph">${game.glyph}</span></div>` +
        `<div class="card-body">` +
        `<div class="card-name">${game.name}</div>` +
        `<span class="card-cat">${game.category}</span>` +
        `<div class="card-desc">${game.desc}</div>` +
        `</div>`;
      const open = () => askToPlay(game);
      card.addEventListener("click", open);
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });
      card._game = game;
      cardEls.push(card);
      grid.appendChild(card);
    }

    section.appendChild(grid);
    catalogEl.appendChild(section);
  }

  // ---- search filtering ----
  function applyFilter() {
    const q = searchEl.value.trim().toLowerCase();
    let anyVisible = false;

    for (const card of cardEls) {
      const g = card._game;
      const match = !q ||
        g.name.toLowerCase().includes(q) ||
        g.category.toLowerCase().includes(q);
      card.classList.toggle("hidden", !match);
      if (match) anyVisible = true;
    }

    // hide category sections with no visible cards
    for (const section of catalogEl.querySelectorAll(".category")) {
      const visible = section.querySelectorAll(".card:not(.hidden)").length > 0;
      section.classList.toggle("hidden", !visible);
    }

    noResultsEl.classList.toggle("show", !anyVisible);
  }

  searchEl.addEventListener("input", applyFilter);
  clearBtn.addEventListener("click", () => {
    searchEl.value = "";
    applyFilter();
    searchEl.focus();
  });

  // ---- confirm + launch ----
  function askToPlay(game) {
    pendingGame = game;
    modalGlyph.textContent = game.glyph;
    modalQ.textContent = game.name;
    modalEl.classList.add("show");
    yesBtn.focus();
  }

  function closeModal() {
    modalEl.classList.remove("show");
    pendingGame = null;
  }

  function launch(game) {
    playerTitle.textContent = game.name;
    newtabLink.href = game.url;
    gameFrame.src = game.url;
    playerEl.classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function closePlayer() {
    playerEl.classList.remove("show");
    gameFrame.src = "about:blank"; // stop the game / free resources
    document.body.style.overflow = "";
  }

  yesBtn.addEventListener("click", () => {
    const game = pendingGame;
    closeModal();
    if (game) launch(game);
  });
  noBtn.addEventListener("click", closeModal);
  modalEl.addEventListener("click", (e) => { if (e.target === modalEl) closeModal(); });
  backBtn.addEventListener("click", closePlayer);

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (playerEl.classList.contains("show")) closePlayer();
    else if (modalEl.classList.contains("show")) closeModal();
  });
})();
</script>
</body>
</html>
